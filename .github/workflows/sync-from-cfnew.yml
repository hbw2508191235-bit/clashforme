name: 从 cfnew 同步内核与文档

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 */6 * * *' # 每6小时自动检查一次

permissions:
  contents: write

concurrency:
  group: sync-from-cfnew
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 拉取上游 core-only 分支
        id: fetch
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/byJoey/cfnew.git
          git fetch --depth=1 upstream core-only:refs/remotes/upstream/core-only

          UPSTREAM_SHA=$(git rev-parse refs/remotes/upstream/core-only)
          echo "sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "上游 core-only HEAD: $UPSTREAM_SHA"
          git log -1 --format='上游最新提交: %h %ad %s' --date=short refs/remotes/upstream/core-only

      - name: 检查是否需要同步
        id: check
        run: |
          CURRENT=""
          if [ -f .upstream-sync ]; then
            CURRENT=$(tr -d '\n\r ' < .upstream-sync)
            echo "已同步的上游提交: $CURRENT"
          else
            echo "尚无同步记录，将执行首次同步"
          fi

          if [ "$CURRENT" = "${{ steps.fetch.outputs.sha }}" ]; then
            echo "need_sync=false" >> $GITHUB_OUTPUT
            echo "上游无新提交，无需同步"
          else
            echo "need_sync=true" >> $GITHUB_OUTPUT
            echo "上游有更新：$CURRENT -> ${{ steps.fetch.outputs.sha }}"
          fi

      - name: 同步上游文件
        if: steps.check.outputs.need_sync == 'true'
        run: |
          set -euo pipefail
          REF=refs/remotes/upstream/core-only

          # 显式关闭行尾转换，保证内核与部署包逐字节等于上游。
          # .gitattributes 已对内核声明 -text，这里再兜一层，
          # 避免换用 Windows runner 或修改全局配置时内核被写成 CRLF。
          git config core.autocrlf false
          git config core.eol lf

          # 内核、部署包与忽略规则：与上游仓库保持字节一致
          git checkout "$REF" -- _worker.js pages.zip .gitignore

          # 文档与脚本：随上游分支实时更新，不受发行节奏限制
          for dir in docs scripts; do
            rm -rf "$dir"
            if git ls-tree --name-only "$REF" "$dir" | grep -q .; then
              git checkout "$REF" -- "$dir"
              echo "已同步 $dir/"
            else
              echo "上游已移除 $dir/，本地同步移除"
            fi
          done

          # 上游说明文档单独留存，避免覆盖本仓库自己的 README
          mkdir -p docs
          git show "$REF:README.md" > docs/upstream-README.md

          echo "${{ steps.fetch.outputs.sha }}" > .upstream-sync

          # 只登记本次同步涉及的路径。用 git add -A 限定路径，既能记录
          # 上游在 docs/、scripts/ 里删掉的文件，又不会把工作目录里
          # 任何无关的残留文件带进提交。
          git add -A -- _worker.js pages.zip .gitignore VERSION.txt .upstream-sync docs scripts

      - name: 校验内核与部署包一致性
        id: verify
        if: steps.check.outputs.need_sync == 'true'
        run: |
          # 实际执行一次来判定解释器可用性，只看 command -v 会命中不可运行的存根
          PY=python3
          "$PY" -c 'import sys' >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import pathlib
          import re
          import sys
          import zipfile

          source = pathlib.Path("_worker.js").read_bytes()
          versions = set(re.findall(rb'["\'](20\d{2}\.\d{1,2}\.\d{1,2}\.\d+)["\']', source))
          if len(versions) != 1:
              sys.exit("内核版本标记缺失或不唯一，停止提交。")
          version = versions.pop().decode()

          archive = pathlib.Path("pages.zip")
          if not archive.is_file():
              sys.exit("缺少 pages.zip，停止提交。")

          with zipfile.ZipFile(archive) as package:
              if package.namelist() != ["_worker.js"]:
                  sys.exit("pages.zip 根目录必须只有 _worker.js，停止提交。")
              if package.read("_worker.js") != source:
                  sys.exit("pages.zip 与 _worker.js 不一致，停止提交。")

          pathlib.Path("VERSION.txt").write_text("v" + version + "\n", encoding="utf-8")
          print("校验通过：内核 " + version + "，部署包与内核字节一致。")
          PY

          # 内核与部署包必须与上游逐字节一致
          if ! git diff --quiet refs/remotes/upstream/core-only -- _worker.js pages.zip; then
            echo "内核或部署包与上游不一致，停止提交。"
            exit 1
          fi
          echo "与上游逐字节比对通过。"

          VERSION=$(tr -d '\n\r ' < VERSION.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 提交并推送
        if: steps.check.outputs.need_sync == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --staged --quiet; then
            echo "文件内容无变化，跳过提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.verify.outputs.version }} (${{ steps.fetch.outputs.sha }})"
            git push origin HEAD:main
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 上游 core-only HEAD: ${{ steps.fetch.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 当前内核版本: $(tr -d '\n\r ' < VERSION.txt 2>/dev/null || echo '未知')" >> $GITHUB_STEP_SUMMARY
          echo "- 已同步提交: $(tr -d '\n\r ' < .upstream-sync 2>/dev/null || echo '未知')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.need_sync }}" = "true" ]; then
            echo "- 状态: ✅ 已同步" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 上游无新提交" >> $GITHUB_STEP_SUMMARY
          fi
